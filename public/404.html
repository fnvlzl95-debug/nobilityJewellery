<!doctype html>
<!-- Cloudflare Pages needs this top-level file to return 404 instead of its implicit home-page SPA fallback. -->
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <title>페이지를 찾을 수 없습니다 | 귀족</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0a0a0a; color: #fafafa; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(100%, 42rem); padding: 4rem 1.5rem; text-align: center; }
      .code { margin: 0 0 1rem; color: #c9a227; font-size: clamp(5rem, 20vw, 9rem); font-weight: 300; line-height: 1; }
      h1 { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 500; }
      .message { margin: 1.5rem 0 2rem; color: #c5c5c5; line-height: 1.8; word-break: keep-all; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; }
      a { display: inline-flex; align-items: center; min-height: 3rem; padding: 0.75rem 1.25rem; border: 1px solid #8d752b; color: #e5c86c; text-decoration: none; }
      a:hover, a:focus-visible { background: #c9a227; color: #0a0a0a; }
      a:focus-visible { outline: 2px solid #fafafa; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>페이지를 찾을 수 없습니다</h1>
      <p class="message">주소가 잘못되었거나 페이지가 이동 또는 삭제되었습니다.<br>주소를 확인하거나 아래에서 필요한 정보를 찾아주세요.</p>
      <nav aria-label="다른 페이지 찾기">
        <a href="/">홈으로 돌아가기</a>
        <a href="/guide">주얼리 가이드</a>
        <a href="/gallery">제작 사례</a>
      </nav>
    </main>
  </body>
</html>
